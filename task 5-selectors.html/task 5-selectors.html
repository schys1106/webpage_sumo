<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors</title>

    <link rel="stylesheet" href="task5-style.css">
</head>

<body>

    <h1>CSS Selectors Example</h1>

    <p>This paragraph uses an Element Selector.</p>

    <p class="highlight">This paragraph uses a Class Selector.</p>

    <p id="special">This paragraph uses an ID Selector.</p>

    <div class="container">
        <p>This paragraph uses a Descendant Selector.</p>
    </div>

    <div class="parent">
        <p>This paragraph uses a Child Selector.</p>

        <div>
            <p>This paragraph is not a direct child.</p>
        </div>
    </div>

</body>

</html>
